<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Swiper demo</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

    <!-- Demo styles -->
    <style>
      html,
      body {
        position: relative;
        height: 100%;
      }

      body {
        background: white;
        font-family:
          Helvetica Neue,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        color: black;
        margin: 0;
        padding: 0;
      }

      .swiper {
        width: 100%;
        height: 100%;
      }

      .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: #444;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .swiper-slide img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .swiper {
        margin-left: auto;
        margin-right: auto;
        width: 100%;
        height: 30%;
        margin-top: 100px;
      }

      .gallery {
        text-align: center;
        font-size: 30px;
      }
    </style>
  </head>

  <body>
    <!-- Swiper -->
     <h1 class="gallery">Gallery Property</h1>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <img src="asset/feature-house.jpg" alt="img 1" class="swiper-slide">
        <img src="asset/feature-house.jpg" alt="img 2" class="swiper-slide">
        <img src="asset/feature-house.jpg" alt="img 3" class="swiper-slide">
        <img src="asset/feature-house.jpg" alt="img 4" class="swiper-slide">
        <img src="asset/feature-house.jpg" alt="img 5" class="swiper-slide">
        <img src="asset/feature-house.jpg" alt="img 6" class="swiper-slide">
      </div>
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
      <div class="swiper-pagination"></div>
    </div>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper('.mySwiper', {
        slidesPerView: 3,
        spaceBetween: 30,
        loop: true,
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
      });
    </script>
  </body>
</html>
